<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask Box</title>
    <script src="https://u.widget.st/ar.js"></script>
  </head>
  <body>
    <h1>Askbox Test</h1>
    <p>Testing out some widget.st stuff! If you see this ignore it...</p>

    <ws-widget type="contact" iid="5101">
      <form>
        <input name="name" placeholder="Your name" />
        <textarea name="message" placeholder="Your message"></textarea>
        <div style="display: none" aria-hidden="true">
          <label for="poot">Leave this field blank</label>
          <input type="text" id="poot" name="poot" />
        </div>
        <button type="submit">Send</button>
      </form>
    </ws-widget>
  </body>
</html>
